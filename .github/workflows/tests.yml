name: Scientific software checks
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: nanodesign check examples/h-abstraction/design.json
      - run: python -m unittest workbench.test_server
      - run: python data/validation/verify_density_fitting_comparison.py
      - run: pytest -q research/saddle-audit research/evidence-audit research/dft-guess-review research/integration-audit research/path-contract-audit
      - run: python -m unittest discover -s research/workbench-boundary-audit -p 'test_*.py'
      - run: python -m unittest discover -s research/compute-planning/tests
      - run: pytest -q research/gpu-readiness
      - run: pytest -q research/state-scan-review
      - run: python -m unittest discover -s research/bundle-audit -p 'test_*.py'
      - run: pytest -q research/mode-comparison
      - run: pytest -q research/characterization-resume
      - run: pytest -q research/characterization-resume-review
      - run: pytest -q research/electronic-state-review
      - run: pytest -q research/electronic-capture-integration-review
      - run: pytest -q research/ao-overlap-bridge
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: pytest -q research/force-energy-consistency
      - run: pytest -q research/force-energy-review
      - run: pytest -q research/local-relaxation-diagnostic
      - run: pytest -q research/local-relaxation-review
