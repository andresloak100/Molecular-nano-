[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-nanodesign"
version = "0.1.0"
description = "Auditable quantum-chemistry workflows for positional diamondoid mechanosynthesis research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "ase>=3.27,<4", "pyscf>=2.14,<3", "dftd3>=1.2"]

[project.optional-dependencies]
test = ["pytest>=8"]
research = ["geometric>=1.1,<2"]

[project.scripts]
nanodesign = "nanodesign.cli:main"

[tool.setuptools.packages.find]
include = ["nanodesign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["quantum: executes actual quantum-chemistry calculations"]
